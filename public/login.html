<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SEGTEC — Ingreso</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --navy: #1F3864; --navy2: #2E5395; --white: #FFFFFF; --gray: #595959; --border: #D0D8E8; --font: 'Inter','Segoe UI',Arial,sans-serif; }
  html { font-size: 13px; }
  body { font-family: var(--font); min-height: 100vh; }
  .screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 60%, #3a6bc4 100%); padding: 20px; }
  .box { background: var(--white); border-radius: 12px; padding: 44px 40px; width: 380px; max-width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .logo { text-align: center; margin-bottom: 28px; }
  .logo .brand { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: var(--navy); display: block; }
  .logo .sub { font-size: 11px; color: var(--gray); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }
  h2 { font-size: 16px; font-weight: 600; color: var(--navy); margin-bottom: 20px; text-align: center; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; }
  .field input:focus { border-color: var(--navy2); }
  .btn { width: 100%; padding: 12px; background: var(--navy); color: var(--white); border: none; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  .btn:hover { background: var(--navy2); }
  .btn:disabled { background: #aaa; cursor: not-allowed; }
  .msg-error { background: #FEE; border: 1px solid #FCC; color: #C00; padding: 10px 14px; border-radius: 6px; font-size: 12px; margin-top: 12px; display: none; text-align: center; }
  .hint { text-align: center; margin-top: 18px; font-size: 11px; color: #aaa; }
  .hint a { color: var(--navy2); text-decoration: none; font-weight: 600; }
  .forgot { text-align: center; margin-top: 10px; font-size: 11.5px; }
  .forgot a { color: var(--navy2); text-decoration: none; }
  .contact { text-align: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--gray); }
  .contact a { color: var(--navy2); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<div class="screen">
  <div class="box">
    <div class="logo"><span class="brand">SEGTEC</span><span class="sub">Lista de precios</span></div>
    <h2>Iniciar sesión</h2>
    <div class="field"><label>Email</label><input type="email" id="l-email" placeholder="tu@email.com"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="l-pass" placeholder="••••••••"></div>
    <button class="btn" id="l-btn" onclick="doLogin()">Ingresar</button>
    <div class="msg-error" id="l-error"></div>
    <p class="forgot"><a href="/olvide-contrasena.html">¿Olvidaste tu contraseña?</a></p>
    <p class="hint">¿Todavía no tenés acceso? <a href="/register.html">Solicitar acceso</a></p>
    <p class="contact">¿Problemas para ingresar? Escribinos a <a href="https://wa.me/5491155958862" target="_blank">+54 9 11 5595-8862</a></p>
  </div>
</div>
<script>
async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const password = document.getElementById('l-pass').value;
  const errorBox = document.getElementById('l-error');
  errorBox.style.display = 'none';
  if (!email || !password) {
    errorBox.textContent = 'Completá email y contraseña.';
    errorBox.style.display = 'block';
    return;
  }
  const btn = document.getElementById('l-btn');
  btn.disabled = true; btn.textContent = 'Ingresando...';
  try {
    const res = await fetch('/api/public-login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      errorBox.textContent = data.error || 'Usuario o contraseña incorrectos.';
      errorBox.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Ingresar';
      return;
    }
    window.location.href = '/catalog.html';
  } catch (e) {
    errorBox.textContent = 'No se pudo conectar. Intentá de nuevo.';
    errorBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
}
document.getElementById('l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

fetch('/api/me', { credentials: 'include' }).then(async (res) => {
  if (res.ok) {
    const data = await res.json();
    if (data.role === 'public') window.location.href = '/catalog.html';
  }
}).catch(() => {});
</script>
</body>
</html>
